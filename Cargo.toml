[package]
name = "emvault-securosys"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gmikeska/emvault-securosys"
description = "Securosys CloudHSM connector for emvault: PKCS#11 (Primus) transport for ECDSA/BIP-32 today, TSB REST (BIP-340/Taproot) transport later."

[lib]
name = "emvault_securosys"
path = "src/lib.rs"

[features]
default = ["pkcs11"]
# Native PKCS#11 (Primus P11 provider) transport — ECDSA + BIP-32/SLIP-10.
pkcs11 = []
# Transaction Security Broker REST transport — Schnorr/BIP-340 for Taproot.
tsb = ["dep:reqwest", "dep:serde_json", "dep:base64"]
taproot = ["tsb"]

[dependencies]
emvault-pkcs11 = { version = "0.7.0", path = "../emvault-pkcs11" }
emvault-core = { version = "0.7.0", path = "../emvault-core" }
bitcoin = "0.32.10"
cryptoki = "0.12"
# Raw PKCS#11 types + the loader for the one Securosys vendor-extension call
# (`C_DeriveKeyPair`) that cryptoki's typed API can't express.
cryptoki-sys = "0.3"
libloading = "0.8"
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
dotenvy = "0.15"
log = "0.4"

# Optional — only compiled for the `tsb` feature (Taproot).
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"], optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
env_logger = "0.11"
# Raw PKCS#11 FFI for the SLIP-10 live-HSM probe (vendor key types / attributes /
# the C_DeriveKeyPair vendor extension aren't expressible via cryptoki's typed API).
cryptoki-sys = "0.3"
libloading = "0.8"
hex = "0.4"
# Live-HSM e2e: drive the overrides through the real Pkcs11Signer + BDK signer path.
bdk_wallet = "3.1.0"
serial_test = "3.5.0"
# Mixed-vendor fleet e2e: a dev SoftHSM cosigner alongside a Securosys one.
emvault-dev-signer = { version = "0.7.0", path = "../emvault-dev-signer" }
dotenvy = "0.15"

[[example]]
name = "slip10_probe"
path = "examples/slip10_probe.rs"

[[example]]
name = "taproot_probe"
path = "examples/taproot_probe.rs"
required-features = ["tsb"]


